<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Share a memory — In Loving Memory of [Full Name]</title>
<meta name="description" content="Share a memory of [Full Name].">
<meta name="theme-color" content="#f8f4ed">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🕊️</text></svg>">
<link rel="preload" href="/fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
</head>

<body>
<main id="main" class="wrap">
  <div class="hero hero--compact">
    <!-- ✏️ EDIT: the name, here and in the hero on the home page -->
    <a class="wordmark" href="/">In Loving Memory of [Full Name]<span class="visually-hidden"> — back to the memorial page</span></a>
    <h1 class="hero__name page-title">Share a memory</h1>
    <p class="hero__note">Every message is read by the family.</p>
  </div>

  <div class="ornament ornament--tight" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1">
      <path d="M10 3 L14 10 L10 17 L6 10 Z"/>
    </svg>
  </div>

  <!-- Announced to screen readers whenever it changes. -->
  <div class="status-msg" id="form-status" role="status" aria-live="polite" data-tone=""></div>

  <form id="memory-form" novalidate>

    <div class="field filefield">
      <span class="field-label">A photograph <span class="optional">(optional)</span></span>
      <span class="hint" id="photo-hint">Any size. It is made smaller on your own device before sending.</span>

      <!-- The input itself is hidden but still focusable; the label beside it is
           what people see and click, and its wording changes once a picture is
           chosen. The browser's own control would otherwise show the file name
           next to a preview of the very same picture. -->
      <input type="file" id="photo" name="photo" accept="image/*"
             class="visually-hidden" aria-describedby="photo-hint">
      <label class="btn btn--ghost filepick" for="photo" id="photo-pick">Choose a photograph</label>

      <div class="preview" id="photo-preview" data-shown="false">
        <img id="photo-preview-img" alt="">
        <button type="button" class="linkbtn" id="photo-remove">Remove</button>
      </div>
    </div>

    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required maxlength="80" autocomplete="name">
    </div>

    <div class="field">
      <label for="message">Your message</label>
      <textarea id="message" name="message" required maxlength="2000"></textarea>
      <p class="counter" aria-hidden="true"><span id="message-count">0</span> / 2,000</p>
    </div>



    <div class="field">
      <label class="choice">
        <input type="checkbox" id="private" name="private">
        <span>
          <span class="choice__title">Keep this private</span>
          <span class="choice__desc">Only the family will ever see it. Left unticked, it
            appears with the memories on the website once the family has approved it.</span>
        </span>
      </label>
    </div>

    <!-- Spam trap: not shown to people, and screen readers skip it. -->
    <div class="hp" aria-hidden="true">
      <label for="website">Leave this field empty</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" class="btn btn--block" id="submit-btn">Send</button>
  </form>

  <p class="hint note">Ask the family if you would like yours removed.</p>
</main>

<footer class="footer">
  <div class="wrap"><p><a href="/memories">Back to the memories</a></p></div>
</footer>

<script src="/assets/share.js" defer></script>
</body>
</html>
