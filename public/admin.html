<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family administration — In Loving Memory</title>
<meta name="theme-color" content="#f8f4ed">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🕊️</text></svg>">
<link rel="preload" href="/fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
</head>

<body>
<a class="skip" href="#main">Skip to the main content</a>

<header class="topbar">
  <nav class="nav wrap" aria-label="Main">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/guestbook">Guestbook</a></li>
    </ul>
  </nav>
</header>

<main id="main" class="wrap">

  <!-- ===================== Sign in ===================== -->
  <section id="login-view" hidden>
    <div class="hero hero--compact">
      <h1 class="hero__name page-title">Family administration</h1>
      <p class="hero__note">Sign in to read private messages and approve public ones.</p>
    </div>

    <div class="status-msg" id="login-status" role="status" aria-live="polite" data-tone=""></div>

    <form id="login-form">
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required
               autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn--block" id="login-btn">Sign in</button>
    </form>
  </section>

  <!-- ===================== Moderation ===================== -->
  <section id="admin-view" hidden>
    <div class="hero hero--tight">
      <h1 class="hero__name page-title">Messages</h1>
    </div>

    <div class="tabs" role="tablist" aria-label="Which messages to show">
      <button role="tab" id="tab-pending" aria-selected="true"  aria-controls="entries" data-filter="pending">
        Waiting for approval <span class="count" data-count="pending"></span>
      </button>
      <button role="tab" id="tab-private" aria-selected="false" aria-controls="entries" data-filter="private">
        Private to the family <span class="count" data-count="private"></span>
      </button>
      <button role="tab" id="tab-public"  aria-selected="false" aria-controls="entries" data-filter="public">
        Live in the guestbook <span class="count" data-count="public"></span>
      </button>
    </div>

    <div class="status-msg" id="admin-status" role="status" aria-live="polite" data-tone=""></div>

    <ul class="entries" id="entries" role="tabpanel" aria-labelledby="tab-pending" tabindex="0"></ul>

    <p class="actions actions--center actions--spaced">
      <button type="button" class="btn btn--ghost" id="logout-btn">Sign out</button>
    </p>
  </section>

</main>

<footer class="footer">
  <div class="wrap">
    <p><a href="/">Back to the memorial page</a></p>
  </div>
</footer>

<script src="/assets/admin.js" defer></script>
</body>
</html>
