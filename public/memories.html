<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memories — In Loving Memory of Merita</title>
<meta name="description" content="Messages of remembrance for Merita.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f8f4ed">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🕊️</text></svg>">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" href="/fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/cormorant-garamond-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/styles.css">
</head>

<body class="has-dock">
<main id="main" class="wrap wrap--memories">
  <div class="hero hero--snug">
    <!-- Her likeness at the size of a locket, above the line that names her, on
         the pages that carry no hero portrait of their own. Decorative: the
         line below says who she is, and a screen reader repeating it here
         would only be in the way. -->
    <img class="portrait portrait--small" src="/assets/merita-small.jpg"
         width="280" height="350" alt="" decoding="async">
    <!-- ✏️ EDIT: the name, here and in the hero on the home page -->
    <a class="wordmark" href="/">In Loving Memory of Merita<span class="visually-hidden"> — back to the memorial details</span></a>
    <h1 class="hero__name page-title">Memories</h1>
    <!-- ✏️ EDIT: their first name -->
    <p class="hero__note">Memories, stories, and tributes to Merita from friends
      and family</p>
  </div>

  <div class="ornament ornament--tight" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.1">
      <path d="M10 3 L14 10 L10 17 L6 10 Z"/>
    </svg>
  </div>

  <noscript>
    <p class="status-msg" data-tone="error"><strong>This page needs JavaScript.</strong>
      Your browser has it switched off, so the memories cannot be shown.</p>
  </noscript>

  <!-- Shown only to someone who has just sent a memory. The thank-you belongs
       at the top of the page they are sent on to, rather than on the form they
       have left behind. -->
  <div class="status-msg" id="thanks" role="status" aria-live="polite" data-tone="ok" hidden></div>

  <div class="status-msg" id="load-status" role="status" aria-live="polite" data-tone="busy">
    <strong>Loading…</strong>
  </div>

  <ul class="entries" id="entries" aria-label="Memories shared by family and friends"></ul>

  <!-- Kept out of the list itself: the memories fall into two columns on a wide
       screen, and this belongs across the width of the page, not down one side. -->
  <p class="empty" id="empty-state" hidden><strong>No memories yet.</strong></p>
</main>

<!-- Docked to the foot of the window so it stays within reach however far
     down the page someone has read. -->
<div class="dock">
  <div class="wrap">
    <a class="btn btn--block" href="/share">Share a memory</a>
  </div>
</div>

<footer class="footer">
  <div class="wrap">
    <p><a href="/">Back to the memorial details</a></p>
  </div>
</footer>

<script src="/assets/memories.js" defer></script>
</body>
</html>
