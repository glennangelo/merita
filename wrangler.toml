# Cloudflare configuration for the memorial website.
#
# Cloudflare reads this file every time it deploys, so the settings here are
# the real ones — there is nothing to configure twice.
#
# ✏️ EDIT: paste your database id from step 2 of the README into database_id.
#    (It is only an identifier, not a password — it is safe to save here.)

name = "memorial"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Everything in public/ is served straight to visitors as an ordinary website.
# The Worker in src/ only runs for addresses that are not a file, which in
# practice means the /api/... calls the pages make.
[assets]
directory = "./public"
binding = "ASSETS"

# The database behind the memories and the replies.
[[d1_databases]]
binding = "DB"
database_name = "memorial-guestbook"
database_id = "PASTE-YOUR-DATABASE-ID-HERE"

# The family password is NOT set here — it is a secret, added in the Cloudflare
# dashboard under Settings → Variables and Secrets. See step 5 of the README.
