# Cloudflare configuration.
#
# You only need this file if you want to preview the site on your own computer
# with `npm start`. Deploying from the Cloudflare dashboard does not use it.
#
# ✏️ EDIT: paste your database id from step 3 of the README into database_id.

name = "memorial"
pages_build_output_dir = "public"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "memorial-guestbook"
database_id = "PASTE-YOUR-DATABASE-ID-HERE"
